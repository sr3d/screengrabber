name: Release

# Tag a commit (e.g. `git tag v1.0 && git push origin v1.0`) to build a
# universal ScreenGrabber.app, package it as a .dmg, and publish a GitHub
# Release with the .dmg attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal .dmg
        run: ARCHS="arm64 x86_64" ./package.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "ScreenGrabber ${GITHUB_REF_NAME}" \
            --generate-notes \
            ScreenGrabber-*.dmg
